<main class="not-found-page">
    <mat-card class="not-found-card">
        <div class="not-found-icon" aria-hidden="true">
            <mat-icon>search_off</mat-icon>
        </div>

        <p class="error-code">Erro 404</p>
        <h1>Página não encontrada</h1>
        <p class="description">O endereço informado não existe ou não está disponível. Confira a URL e tente novamente.</p>

        <button mat-flat-button type="button" (click)="goBack()">
            <mat-icon>arrow_back</mat-icon>
            Voltar
        </button>
    </mat-card>
</main>
